name: V2 X6882 Build 5.10 Kernel + addon (Neutron Clang)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "Custom kernel name"
        required: true
        default: "Aetherium"
      BASE_REPO:
        description: "Base kernel repo (e.g. ramabondanp or android.googlesource.com/kernel/common.git)"
        required: true
        default: "https://github.com/ramabondanp/android_kernel_common-5.10.git"
      BASE_BRANCH:
        description: "Base repo branch"
        required: true
        default: "android12-5.10"
      UPSTREAM_TAG:
        description: "Google upstream tag to merge (leave empty to skip merge)"
        required: false
        default: ""
      MERGE_STRATEGY:
        description: "How to handle merge conflicts"
        required: true
        type: choice
        options:
          - "theirs-auto"
          - "ours-auto"
          - "fail-on-conflict"
        default: "theirs-auto"
      ENABLE_KERNELSU_NEXT:
        description: "Enable KernelSU (Root)"
        required: true
        type: boolean
        default: true
      ROOT_MANAGER:
        description: "Root Manager (KSU Fork)"
        required: true
        type: choice
        options:
          - "KernelSU-Next"
          - "ReSukiSU"
          - "SuKiSU-Ultra"
        default: "KernelSU-Next"
      ENABLE_SUSFS:
        description: "Patch SuSFS for KernelSU"
        required: true
        type: boolean
        default: true
      KSU_NEXT_BRANCH:
        description: "KernelSU-Next branch"
        required: false
        default: "dev-susfs"
      RESUKISU_BRANCH:
        description: "ReSukiSU branch (kosongkan untuk default main)"
        required: false
        default: ""
      SUKISU_BRANCH:
        description: "SuKiSU-Ultra branch (kosongkan untuk default builtin/main)"
        required: false
        default: ""
      LTO_TYPE:
        description: "LTO type"
        required: false
        type: choice
        options:
          - "thin"
          - "full"
          - "none"
        default: "thin"
      ENABLE_BBRV3:
        description: "Patch BBRv3 (TCP Congestion)"
        required: true
        type: boolean
        default: false
      ENABLE_DROIDSPACES:
        description: "Patch Droidspaces (LXC)"
        required: true
        type: boolean
        default: false
      ENABLE_LZ4KD:
        description: "Patch LZ4KD (ZRAM)"
        required: true
        type: boolean
        default: false
      ENABLE_NTSYNC:
        description: "Patch NTSYNC"
        required: true
        type: boolean
        default: false
      ENABLE_BLACKLIST:
        description: "X6882 Prank (KSU Spoof)"
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: "${{ inputs.KERNEL_NAME }} | 5.10 | ${{ inputs.UPSTREAM_TAG || 'no-merge' }} | Neutron"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNEL_NAME: ${{ inputs.KERNEL_NAME || 'Aetherium' }}
      BASE_REPO: ${{ inputs.BASE_REPO }}
      BASE_BRANCH: ${{ inputs.BASE_BRANCH || 'android12-5.10' }}
      UPSTREAM_TAG: ${{ inputs.UPSTREAM_TAG }}
      MERGE_STRATEGY: ${{ inputs.MERGE_STRATEGY || 'theirs-auto' }}
      ENABLE_KSU: ${{ inputs.ENABLE_KERNELSU_NEXT }}
      ROOT_MANAGER: ${{ inputs.ROOT_MANAGER }}
      ENABLE_SUSFS: ${{ inputs.ENABLE_SUSFS }}
      LTO: ${{ inputs.LTO_TYPE || 'thin' }}
      ENABLE_BBRV3: ${{ inputs.ENABLE_BBRV3 }}
      ENABLE_DROIDSPACES: ${{ inputs.ENABLE_DROIDSPACES }}
      ENABLE_LZ4KD: ${{ inputs.ENABLE_LZ4KD }}
      ENABLE_NTSYNC: ${{ inputs.ENABLE_NTSYNC }}
      ENABLE_BLACKLIST: ${{ inputs.ENABLE_BLACKLIST }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 python3 \
            python-is-python3 rsync zip unzip jq zstd

      - name: Setup swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure git
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Kernel Builder"
          git config --global color.ui false

      # ──────────────────────────────────────────────
      # 1. Clone base kernel & Tools
      # ──────────────────────────────────────────────
      - name: Clone base kernel
        run: |
          echo "::group::Cloning Luminaire Tools (from aetherium-build)"
          git clone --depth=1 https://github.com/kaminarich/aetherium-build.git luminaire_tools
          echo "::endgroup::"

          echo "::group::Cloning base kernel: $BASE_REPO ($BASE_BRANCH)"
          git clone --branch "$BASE_BRANCH" "$BASE_REPO" kernel
          echo "::endgroup::"
          cd kernel
          echo "Base HEAD: $(git log --oneline -1)"
          echo "Total commits: $(git rev-list --count HEAD)"

      # ──────────────────────────────────────────────
      # 2. Merge upstream Google tag
      # ──────────────────────────────────────────────
      - name: Merge upstream Google tag
        if: inputs.UPSTREAM_TAG != ''
        run: |
          cd kernel

          echo "::group::Adding Google upstream remote"
          git remote add google https://android.googlesource.com/kernel/common
          echo "::endgroup::"

          echo "::group::Fetching upstream tag: $UPSTREAM_TAG"
          git fetch google "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" || {
            echo "::error::Failed to fetch tag $UPSTREAM_TAG from Google. Check if tag exists."
            exit 1
          }
          echo "::endgroup::"

          echo "── Upstream tag info ──"
          git log --oneline -1 "refs/tags/$UPSTREAM_TAG" || true

          echo "::group::Merging upstream tag into base kernel"
          case "$MERGE_STRATEGY" in
            theirs-auto)
              echo "Strategy: Accept upstream changes on conflict (theirs)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X theirs \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: theirs)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (accepting upstream)"
                    git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: theirs)" || true
                }
              ;;
            ours-auto)
              echo "Strategy: Keep our changes on conflict (ours)"
              git merge "refs/tags/$UPSTREAM_TAG" \
                -X ours \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH (auto: ours)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (keeping ours)"
                    git checkout --ours "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream $UPSTREAM_TAG (conflicts resolved: ours)" || true
                }
              ;;
            fail-on-conflict)
              echo "Strategy: Fail if any conflicts"
              git merge "refs/tags/$UPSTREAM_TAG" \
                --no-edit \
                -m "Merge upstream $UPSTREAM_TAG into $BASE_BRANCH" || {
                  echo "::error::Merge conflicts detected! Conflicting files:"
                  git diff --name-only --diff-filter=U
                  echo ""
                  echo "::error::Use 'theirs-auto' or 'ours-auto' strategy, or resolve manually."
                  exit 1
                }
              ;;
          esac
          echo "::endgroup::"

          echo "✓ Merge complete"
          echo "Merged HEAD: $(git log --oneline -1)"

      # ──────────────────────────────────────────────
      # 3. Set kernel name
      # ──────────────────────────────────────────────
      - name: Set kernel name
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" >> "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
            echo "✓ Kernel name: -$KERNEL_NAME"
          fi

      # ──────────────────────────────────────────────
      # 4. Patch Root Manager & SuSFS
      # ──────────────────────────────────────────────
      - name: Patch Root Manager
        run: |
          echo "KSU_VER=Disabled" >> $GITHUB_ENV
          echo "SUSFS_STATUS=Disabled" >> $GITHUB_ENV

          if [ "$ENABLE_KSU" = "true" ]; then
            cd kernel
            export KERNEL_SRC="$PWD"
            export ROOT_DIR="$GITHUB_WORKSPACE"
            export LUMINAIRE_PATCH_DIR="$GITHUB_WORKSPACE/luminaire_tools"

            # 🛠️ Tambahan: Deklarasikan fungsi untuk resukisu.sh / sukisu.sh
            function log() { echo "✅ $1"; }
            export -f log
            function error() { echo "❌ $1"; exit 1; }
            export -f error
            function warn() { echo "⚠️ $1"; }
            export -f warn

            echo "::group::Integrating $ROOT_MANAGER"
            
            if [ "$ROOT_MANAGER" = "KernelSU-Next" ]; then
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/${{ inputs.KSU_NEXT_BRANCH }}/kernel/setup.sh" | bash -s "${{ inputs.KSU_NEXT_BRANCH }}"
              
              DEFCONFIG="arch/arm64/configs/gki_defconfig"
              if [ -f "$DEFCONFIG" ]; then
                echo "" >> "$DEFCONFIG"
                echo "# KernelSU" >> "$DEFCONFIG"
                echo "CONFIG_KSU=y" >> "$DEFCONFIG"
                echo "CONFIG_KSU_MANUAL_SU=n" >> "$DEFCONFIG"
                echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG"

                echo "" >> "$DEFCONFIG"
                echo "# Required for KSU" >> "$DEFCONFIG"
                echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
                echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
                echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
                echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
                echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
                echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
                echo "✓ Root Manager configs added"
              fi
              echo "KSU_VER=$ROOT_MANAGER" >> $GITHUB_ENV

            elif [ "$ROOT_MANAGER" = "ReSukiSU" ]; then
              if [ -n "${{ inputs.RESUKISU_BRANCH }}" ]; then
                export RESUKISU_REF="${{ inputs.RESUKISU_BRANCH }}"
              fi
              bash "$LUMINAIRE_PATCH_DIR/kernel/android14-6.1-lts/ksu/resukisu/resukisu.sh"

            elif [ "$ROOT_MANAGER" = "SuKiSU-Ultra" ]; then
              export SUSFS_ENABLED="$ENABLE_SUSFS"
              if [ -n "${{ inputs.SUKISU_BRANCH }}" ]; then
                export SUKISU_REF="${{ inputs.SUKISU_BRANCH }}"
                export SUKISU_BUILTIN_REF="${{ inputs.SUKISU_BRANCH }}"
              fi
              bash "$LUMINAIRE_PATCH_DIR/kernel/android14-6.1-lts/ksu/sukisu/sukisu.sh"
            fi
            
            echo "::endgroup::"

            if [ ! -d "drivers/kernelsu" ] && [ ! -d "KernelSU" ]; then
              echo "::error::Root Manager integration failed"
              exit 1
            fi
            
            # Set KSU_VER dari file script jika tersedia
            if [ -z "$RESUKISU_VERSION_DISPLAY" ] && [ -z "$SUKISU_VERSION_DISPLAY" ]; then
              echo "KSU_VER=$ROOT_MANAGER" >> $GITHUB_ENV
            fi
            cd ..
          fi
      - name: Patch SuSFS for 5.10
        if: inputs.ENABLE_KERNELSU_NEXT == true && inputs.ENABLE_SUSFS == true
        run: |
          cd kernel

          echo "::group::Integrating SuSFS for 5.10"
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          susfs="sus/kernel_patches"
          cp -r "$susfs/fs" .
          cp -r "$susfs/include" .
          cp -r "$susfs/50_add_susfs_in_gki-android12-5.10.patch" .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || {
            echo "::warning::SuSFS patch had issues applying cleanly, some hunks may have failed or already been applied."
          }

          # Fix set_nameidata arguments (some 5.10 kernels use 3 args instead of 4)
          echo "::group::Fixing set_nameidata in fs/namei.c"
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL)/set_nameidata(nd, old_dfd, fake_filename)/g' fs/namei.c
          echo "::endgroup::"

          echo "::endgroup::"

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "✓ SuSFS configs added"
          fi

          echo "SUSFS_STATUS=Enabled" >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # X. Apply Optimization Addons
      # ──────────────────────────────────────────────
      - name: Apply Optimization Addons
        run: |
          cd kernel
          export KERNEL_SRC="$PWD"
          export KERNEL_VERSION="5.10"
          export LUMINAIRE_PATCH_DIR="$GITHUB_WORKSPACE"
          export ROOT_DIR="$GITHUB_WORKSPACE"
          
          echo "::group::Mempersiapkan Lingkungan Addons secara Otomatis"
          # 1. Update hardcoded paths dari kernel/ ke add-on/
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/addons/|/add-on/addons/|g' {} +
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's|/kernel/patches/|/add-on/patches/|g' {} +
          
          # 2. Hancurkan backtick nyasar di droidspaces.sh
          sed -i 's/^KABI_PATCH=.*/KABI_PATCH="$LUMINAIRE_PATCH_DIR\/add-on\/patches\/001_GKI-below-6_12-fix_sysvipc_kabi_6_7_8.patch"/g' "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh" 2>/dev/null || true
          
          # 3. FIX HARDCODE 6.1 DI LZ4KD.SH! Ubah 6.1 menjadi versi kernel aktual yang dibuild
          sed -i 's|/zram_patch/6.1/|/zram_patch/${KERNEL_VERSION}/|g' "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh" 2>/dev/null || true
          
          # 4. Mencegah infinite hang: Paksa semua curl agar timeout maksimal 15 detik
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/curl -LSs /curl -LSs -m 15 /g' {} +
          
          # 5. Mencegah stuck: Paksa semua command patch memakai --batch
          find "$GITHUB_WORKSPACE/add-on/addons" -type f -name "*.sh" -exec sed -i 's/patch -p1/patch -p1 --batch/g' {} +
          echo "::endgroup::"
          
          function log() { echo "✅ $1"; }
          export -f log
          function error() { echo "❌ $1"; exit 1; }
          export -f error
          function warn() { echo "⚠️ $1"; }
          export -f warn

          if [ "${{ inputs.ENABLE_BLACKLIST }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/blacklist/blacklist.sh"
          fi
          if [ "${{ inputs.ENABLE_BBRV3 }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/bbrv3/bbrv3.sh"
          fi
          if [ "${{ inputs.ENABLE_DROIDSPACES }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/droidspaces/droidspaces.sh"
          fi
          if [ "${{ inputs.ENABLE_LZ4KD }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/lz4kd/lz4kd.sh"
          fi
          if [ "${{ inputs.ENABLE_NTSYNC }}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/add-on/addons/ntsync/ntsync.sh"
          fi

      # ──────────────────────────────────────────────
      # 5. Download toolchain & Build
      # ──────────────────────────────────────────────
      - name: Download Neutron Clang toolchain
        run: |
          echo "::group::Downloading Neutron Clang (via antman)"
          git clone https://github.com/Neutron-Toolchains/antman --depth=1 "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          ./antman -S
          echo "::endgroup::"
          echo "Clang version:"
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -2

          echo "CLANG_VER=Neutron Clang" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/dist"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "::group::Configuring (gki_defconfig)"
          make O=out gki_defconfig
          echo "::endgroup::"

          case "$LTO" in
            thin)
              echo "::group::Applying LTO=thin"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_THIN \
                -d LTO_NONE -d LTO_CLANG_FULL
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
            full)
              echo "::group::Applying LTO=full"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_FULL \
                -d LTO_NONE -d LTO_CLANG_THIN
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
          esac

          echo "::group::Compiling kernel"
          set -o pipefail
          make O=out -j"$(nproc --all)" Image 2>&1 | tee build.log || {
            echo "::error::Build failed! Check build.log."
            exit 1
          }
          echo "::endgroup::"

          # Copy output
          cp out/arch/arm64/boot/Image* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

          echo "── Build output ──"
          ls -lh "$GITHUB_WORKSPACE/dist/"

          # Extract kernel version dynamically
          if [ -f out/include/generated/utsrelease.h ]; then
            KVER=$(grep UTS_RELEASE out/include/generated/utsrelease.h | cut -d'"' -f2)
            echo "Kernel version: $KVER"
            echo "KVER=$KVER" >> $GITHUB_ENV
          else
            echo "KVER=Unknown" >> $GITHUB_ENV
          fi

      # ──────────────────────────────────────────────
      # 6. Package with AnyKernel3 (AetheriumAnykernel)
      # ──────────────────────────────────────────────
      - name: Package with AnyKernel3
        id: artifacts
        run: |
          echo "::group::Packaging with AetheriumAnykernel (branch: gki)"
          git clone --depth=1 -b gki https://github.com/kaminarich/AetheriumAnykernel.git anykernel

          if [ ! -f "$GITHUB_WORKSPACE/dist/Image" ]; then
            echo "::error::Image not found, cannot pack AnyKernel3"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/dist/Image" anykernel/Image

          KSU_TAG=""
          if [ "$ENABLE_KSU" = "true" ]; then
            if [ "$ROOT_MANAGER" = "KernelSU-Next" ]; then
              KSU_TAG="-KSU-Next"
            elif [ "$ROOT_MANAGER" = "ReSukiSU" ]; then
              KSU_TAG="-ReSukiSU"
            elif [ "$ROOT_MANAGER" = "SuKiSU-Ultra" ]; then
              KSU_TAG="-SuKiSU"
            fi
            
            if [ "$ENABLE_SUSFS" = "true" ]; then
              KSU_TAG="${KSU_TAG}-SuSFS"
            fi
          fi

          UPSTREAM_LABEL="${UPSTREAM_TAG:-base-only}"
          BUILD_NAME="${KERNEL_NAME}-5.10-${UPSTREAM_LABEL}${KSU_TAG}-Neutron"
          DATE_TAG=$(date +%Y%m%d)
          ZIP_NAME="${BUILD_NAME}-${DATE_TAG}-${GITHUB_RUN_NUMBER}"

          cd anykernel
          zip -r9 "../dist/${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      # ──────────────────────────────────────────────
      # 7. Upload & Release to GitHub
      # ──────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          compression-level: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: "${{ steps.artifacts.outputs.build_name }}"
          body: |
            ## 🔧 ${{ inputs.KERNEL_NAME }} — Android 5.10 GKI Kernel

            | Property | Value |
            |----------|-------|
            | **Kernel** | ${{ env.KVER }} |
            | **Base Source** | [${{ inputs.BASE_BRANCH }}](<${{ inputs.BASE_REPO }}>) |
            | **Upstream Merged** | ${{ inputs.UPSTREAM_TAG || 'none' }} |
            | **Compiler** | ${{ env.CLANG_VER }} |
            | **Root Manager** | ${{ env.KSU_VER }} |
            | **SuSFS** | ${{ env.SUSFS_STATUS }} |
            | **Build** | #${{ github.run_number }} |

            ### 📥 Flash
            1. Download zip below
            2. Flash via **TWRP / EXKM / FKM** atau KernelSU Manager.
            3. Reboot
          files: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          draft: false
          prerelease: false

      # ──────────────────────────────────────────────
      # 8. Send to Telegram
      # ──────────────────────────────────────────────
      - name: Send to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram tokens not set. Skipping upload to Telegram."
            exit 0
          fi

          echo "Sending ZIP to Telegram..."

          if [ -n "$RESUKISU_VERSION_DISPLAY" ]; then
            FINAL_KSU_VER="ReSukiSU $RESUKISU_VERSION_DISPLAY"
          elif [ -n "$SUKISU_VERSION_DISPLAY" ]; then
            FINAL_KSU_VER="SuKiSU-Ultra $SUKISU_VERSION_DISPLAY"
          else
            FINAL_KSU_VER="${{ env.KSU_VER }}"
          fi

          CAPTION="Build Completed
          Kernel Version: ${{ env.KVER }}
          Compiler: ${{ env.CLANG_VER }}
          Root Manager: $FINAL_KSU_VER
          SuSFS: ${{ env.SUSFS_STATUS }}
          LTO: ${{ inputs.LTO_TYPE }}"

          curl -F document=@"${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument?chat_id=${TG_CHAT_ID}"

      # ──────────────────────────────────────────────
      # 9. Send Error to Telegram (On Failure)
      # ──────────────────────────────────────────────
      - name: Send Error Log to Telegram
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram tokens not set."
            exit 0
          fi

          echo "Build Failed! Sending log to Telegram..."

          ERROR_LOG="error_log.txt"
          if [ -f kernel/build.log ]; then
            echo "=== LAST 150 LINES OF LOG ===" > $ERROR_LOG
            tail -n 150 kernel/build.log >> $ERROR_LOG
            echo "" >> $ERROR_LOG
            echo "=== FILTERED ERRORS ===" >> $ERROR_LOG
            grep -iE "error:|warning:|undefined reference" kernel/build.log | tail -n 50 >> $ERROR_LOG
          else
            echo "Log file not found. Error happened before compilation." > $ERROR_LOG
          fi

          CAPTION="🚨 <b>BUILD FAILED!</b> 🚨
          <b>Kernel:</b> ${{ inputs.KERNEL_NAME }} (5.10)
          <b>Compiler:</b> ${{ env.CLANG_VER }}
          <b>Upstream:</b> ${{ inputs.UPSTREAM_TAG || 'none' }}
          <b>Action:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View Action Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT_ID}" \
            -F document=@"$ERROR_LOG" \
            -F caption="$CAPTION" \
            -F parse_mode="HTML"
