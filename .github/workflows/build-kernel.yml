name: Build GKI Kernel

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "Custom kernel name (used in LOCALVERSION & release)"
        required: true
        default: "Aetherium"

      KERNEL_VERSION:
        description: "Kernel version to build"
        required: true
        type: choice
        options:
          - "android14-6.1"
          - "android12-5.10"
        default: "android14-6.1"

      UPSTREAM_BRANCH:
        description: "AOSP upstream branch (e.g. android14-6.1-2026-06 or android12-5.10-2026-07)"
        required: false
        default: "android14-6.1-2026-06"

      ENABLE_KERNELSU_NEXT:
        description: "Patch KernelSU-Next into kernel"
        required: true
        type: boolean
        default: true

      KSU_NEXT_BRANCH:
        description: "KernelSU-Next branch (e.g. dev, next, stable, or a tag)"
        required: false
        default: "dev"

      LTO_TYPE:
        description: "LTO (Link Time Optimization) type"
        required: false
        type: choice
        options:
          - "thin"
          - "full"
          - "none"
        default: "thin"
        
      SOURCE_TYPE:
        description: "Source Type"
        required: true
        type: choice
        options:
          - "google"
          - "clone"
        default: "google"
        
      GIT_REPO:
        description: "(Clone Only) Git Repository URL"
        required: false
        default: "https://github.com/ramabondanp/android_kernel_common-5.10"
        
      GIT_BRANCH:
        description: "(Clone Only) Git Branch"
        required: false
        default: "android12-5.10"

jobs:
  build:
    name: "Build ${{ inputs.UPSTREAM_BRANCH }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNEL_NAME: ${{ inputs.KERNEL_NAME || 'Aetherium' }}
      KERNEL_VERSION: ${{ inputs.KERNEL_VERSION }}
      UPSTREAM_BRANCH: ${{ inputs.UPSTREAM_BRANCH }}
      ENABLE_KSU: ${{ inputs.ENABLE_KERNELSU_NEXT }}
      KSU_BRANCH: ${{ inputs.KSU_NEXT_BRANCH || 'dev' }}
      LTO: ${{ inputs.LTO_TYPE || 'thin' }}
      SOURCE_TYPE: ${{ inputs.SOURCE_TYPE || 'google' }}
      GIT_REPO: ${{ inputs.GIT_REPO }}
      GIT_BRANCH: ${{ inputs.GIT_BRANCH }}

    steps:
      # ──────────────────────────────────────────────
      # 1. Checkout & Environment Setup
      # ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "::group::Freeing disk space"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "::endgroup::"
          echo "── Available disk space ──"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 python3 \
            python-is-python3 rsync zip unzip jq

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/.bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/.bin/repo"
          chmod a+x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Setup swap space
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo "── Memory info ──"
          free -h

      - name: Configure git
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Kernel Builder"
          git config --global color.ui false

      # ──────────────────────────────────────────────
      # 2. Validate Inputs
      # ──────────────────────────────────────────────
      - name: Validate inputs
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║       Build Configuration            ║"
          echo "╠══════════════════════════════════════╣"
          echo "║ Kernel Name    : $KERNEL_NAME"
          echo "║ Kernel Version : $KERNEL_VERSION"
          echo "║ Upstream Branch: $UPSTREAM_BRANCH"
          echo "║ KernelSU-Next  : $ENABLE_KSU (branch: $KSU_BRANCH)"
          echo "║ LTO Type       : $LTO"
          echo "╚══════════════════════════════════════╝"

          # Validate branch matches kernel version
          if [ "$SOURCE_TYPE" = "google" ]; then
            if [[ "$UPSTREAM_BRANCH" != "$KERNEL_VERSION"* ]]; then
              echo "::error::Upstream branch '$UPSTREAM_BRANCH' does not match kernel version '$KERNEL_VERSION'"
              echo "::error::Branch should start with '$KERNEL_VERSION' (e.g., ${KERNEL_VERSION}-2026-06)"
              exit 1
            fi
          else
            echo "::notice::Clone source selected, bypassing UPSTREAM_BRANCH validation."
          fi

      # ──────────────────────────────────────────────
      # 3. Sync Kernel Source
      # ──────────────────────────────────────────────
      - name: Sync kernel source
        run: |
          mkdir -p kernel-build && cd kernel-build

          if [ "$SOURCE_TYPE" = "clone" ]; then
            echo "::group::Cloning kernel source tree from $GIT_REPO"
            git clone --depth=1 --branch "$GIT_BRANCH" "$GIT_REPO" common
            echo "::endgroup::"
          else
            # Google manifest branches use the format: common-androidXX-Y.Z-YYYY-MM
            # We strip any _r* suffix from the upstream branch (e.g. android14-6.1-2026-06_r1)
            # because the manifest repo only uses the month.
            UPSTREAM_CLEAN="${UPSTREAM_BRANCH%_r*}"
            MANIFEST_BRANCH="common-${UPSTREAM_CLEAN}"
            echo "Manifest branch: $MANIFEST_BRANCH"
  
            echo "::group::Initializing repo (manifest: $MANIFEST_BRANCH)"
            repo init \
              -u https://android.googlesource.com/kernel/manifest \
              -b "$MANIFEST_BRANCH" \
              --depth=1
            echo "::endgroup::"
  
            echo "::group::Syncing kernel source tree"
            repo sync -j"$(nproc)" --force-sync --no-clone-bundle --no-tags --current-branch
            echo "::endgroup::"
          fi

          echo "── Kernel source tree ──"
          ls -la
          echo "── Disk usage ──"
          df -h /

      - name: Set custom kernel name
        run: |
          cd kernel-build

          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            # Remove any existing LOCALVERSION line
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
            # Set custom kernel name
            echo "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" >> "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
            echo "✓ Kernel name set to: -${KERNEL_NAME}"
          else
            echo "::warning::gki_defconfig not found, LOCALVERSION not set"
          fi

      # ──────────────────────────────────────────────
      # 4. Patch KernelSU-Next
      # ──────────────────────────────────────────────
      - name: Patch KernelSU-Next
        if: inputs.ENABLE_KERNELSU_NEXT == true
        run: |
          cd kernel-build

          echo "::group::Integrating KernelSU-Next (branch: $KSU_BRANCH)"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BRANCH"
          echo "::endgroup::"

          # Enable KSU + required support configs in GKI defconfig
          DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "" >> "$DEFCONFIG"
            echo "# KernelSU-Next" >> "$DEFCONFIG"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG"

            echo "" >> "$DEFCONFIG"
            echo "# Required for KSU (overlay, kprobes, xattr)" >> "$DEFCONFIG"
            echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"

            echo "✓ KernelSU-Next + support configs added to gki_defconfig"
          else
            echo "::warning::gki_defconfig not found at $DEFCONFIG"
          fi

          # Verify integration
          if [ -d "common/drivers/kernelsu" ]; then
            echo "✓ KernelSU-Next source found at common/drivers/kernelsu"
          elif [ -d "drivers/kernelsu" ]; then
            echo "✓ KernelSU-Next source found at drivers/kernelsu"
          else
            echo "::error::KernelSU-Next integration failed — source directory not found"
            exit 1
          fi

      # ──────────────────────────────────────────────
      # 5. Prepare build environment
      # ──────────────────────────────────────────────
      - name: Normalize defconfig
        run: |
          cd kernel-build

          # ── Normalize defconfig for strict consistency check ──
          echo "::group::Normalizing defconfig (savedefconfig)"
          cd common
          make ARCH=arm64 O=../out_defconfig_tmp gki_defconfig 2>&1 | tail -3
          make ARCH=arm64 O=../out_defconfig_tmp savedefconfig 2>&1 | tail -3
          cp ../out_defconfig_tmp/defconfig arch/arm64/configs/gki_defconfig
          rm -rf ../out_defconfig_tmp
          cd ..
          echo "::endgroup::"
          echo "✓ Defconfig normalized"

      - name: Prepare build (android14-6.1)
        if: inputs.KERNEL_VERSION == 'android14-6.1'
        run: |
          cd kernel-build
          # GKI 6.1 enforces protected symbol export lists.
          # KernelSU adds symbols not in the official list → build fails.
          if [ -f "common/BUILD.bazel" ]; then
            sed -i '/protected_exports_list/d' common/BUILD.bazel 2>/dev/null || true
            echo "✓ Protected exports check removed from BUILD.bazel"
          fi
          rm -f common/android/abi_gki_protected_exports_* 2>/dev/null || true

      # ──────────────────────────────────────────────
      # 6. Build Kernel
      # ──────────────────────────────────────────────
      - name: Build kernel (android14-6.1 / Kleaf-Bazel)
        if: inputs.KERNEL_VERSION == 'android14-6.1'
        run: |
          cd kernel-build

          echo "::group::Building kernel with Kleaf/Bazel (LTO=$LTO)"
          LTO="$LTO" tools/bazel run \
            --config=fast \
            --nokmi_symbol_list_strict_mode \
            //common:kernel_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/dist"
          echo "::endgroup::"

          echo "── Build output ──"
          ls -la "$GITHUB_WORKSPACE/dist/" || true

      - name: Build kernel (android12-5.10 / build.sh)
        if: inputs.KERNEL_VERSION == 'android12-5.10'
        run: |
          cd kernel-build

          # Disable KMI/ABI strict checks & defconfig formatting checks
          export KMI_SYMBOL_LIST_STRICT_MODE=0
          export TRIM_NONLISTED_KMI=0
          export SKIP_DEFCONFIG_CHECK=1

          echo "::group::Building kernel with build.sh (LTO=$LTO)"
          DIST_DIR="$GITHUB_WORKSPACE/dist" \
          LTO="$LTO" \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          build/build.sh
          echo "::endgroup::"

          echo "── Build output ──"
          ls -la "$GITHUB_WORKSPACE/dist/" || true

      # ──────────────────────────────────────────────
      # 7. Prepare & Package Artifacts
      # ──────────────────────────────────────────────
      - name: Prepare artifacts
        id: artifacts
        run: |
          echo "── Checking dist directory ──"
          ls -la "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

          # Locate kernel image (prefer uncompressed > lz4 > gz)
          KERNEL_IMAGE=""
          for img in Image Image.lz4 Image.gz; do
            if [ -f "$GITHUB_WORKSPACE/dist/$img" ]; then
              KERNEL_IMAGE="$GITHUB_WORKSPACE/dist/$img"
              KERNEL_IMAGE_NAME="$img"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "::error::No kernel image found in dist directory!"
            find "$GITHUB_WORKSPACE/dist/" -type f -name "Image*" 2>/dev/null || true
            exit 1
          fi

          echo "✓ Kernel image: $KERNEL_IMAGE"
          echo "kernel_image=$KERNEL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "kernel_image_name=$KERNEL_IMAGE_NAME" >> "$GITHUB_OUTPUT"

          # Generate build name
          KSU_TAG=""
          if [ "$ENABLE_KSU" = "true" ]; then
            KSU_TAG="-KSU-Next"
          fi
          BUILD_NAME="${KERNEL_NAME}-${UPSTREAM_BRANCH}${KSU_TAG}"
          DATE_TAG=$(date +%Y%m%d)
          RELEASE_TAG="${BUILD_NAME}-${DATE_TAG}-${GITHUB_RUN_NUMBER}"

          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"

          echo "Build name : $BUILD_NAME"
          echo "Release tag: $RELEASE_TAG"

      # ──────────────────────────────────────────────
      # 8. Upload & Release
      # ──────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.build_name }}
          path: |
            ${{ github.workspace }}/dist/Image
            ${{ github.workspace }}/dist/Image.lz4
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: "${{ steps.artifacts.outputs.build_name }}"
          body: |
            ## 🔧 ${{ inputs.KERNEL_NAME }} — GKI Kernel Build

            | Property | Value |
            |----------|-------|
            | **Kernel Name** | `${{ inputs.KERNEL_NAME }}` |
            | **Kernel Version** | `${{ inputs.KERNEL_VERSION }}` |
            | **Upstream Branch** | [`${{ inputs.UPSTREAM_BRANCH }}`](https://android.googlesource.com/kernel/common/+/refs/heads/${{ inputs.UPSTREAM_BRANCH }}) |
            | **KernelSU-Next** | ${{ inputs.ENABLE_KERNELSU_NEXT == true && format('✅ Enabled ([{0}](https://github.com/KernelSU-Next/KernelSU-Next/tree/{0}))', inputs.KSU_NEXT_BRANCH) || '❌ Disabled' }} |
            | **LTO** | `${{ inputs.LTO_TYPE }}` |
            | **Build** | `#${{ github.run_number }}` |
            | **Date** | `${{ steps.artifacts.outputs.date_tag }}` |



            ### 📦 Source
            - **Kernel**: [android.googlesource.com/kernel/common](https://android.googlesource.com/kernel/common/+/refs/heads/${{ inputs.UPSTREAM_BRANCH }})
            ${{ inputs.ENABLE_KERNELSU_NEXT == true && format('- **KernelSU-Next**: [KernelSU-Next/{0}](https://github.com/KernelSU-Next/KernelSU-Next/tree/{0})', inputs.KSU_NEXT_BRANCH) || '' }}
          files: |
            ${{ github.workspace }}/dist/Image
            ${{ github.workspace }}/dist/Image.lz4
          draft: false
          prerelease: false
