name: Build 5.10 Kernel (Clone + Upstream Merge)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: "Custom kernel name"
        required: true
        default: "Aetherium"

      BASE_REPO:
        description: "Base kernel repo (known working source)"
        required: true
        default: "https://github.com/XTENSEI/kernel_common_5.10.git"

      BASE_BRANCH:
        description: "Base repo branch"
        required: true
        default: "android12-5.10"

      UPSTREAM_TAG:
        description: "Google upstream tag to merge (leave empty to skip merge)"
        required: false
        default: ""

      MERGE_STRATEGY:
        description: "How to handle merge conflicts"
        required: true
        type: choice
        options:
          - "theirs-auto"
          - "ours-auto"
          - "fail-on-conflict"
        default: "theirs-auto"

      ENABLE_KERNELSU_NEXT:
        description: "Patch KernelSU-Next"
        required: true
        type: boolean
        default: true

      ENABLE_SUSFS:
        description: "Patch SuSFS for KernelSU-Next"
        required: true
        type: boolean
        default: true

      KSU_NEXT_BRANCH:
        description: "KernelSU-Next branch"
        required: false
        default: "dev-susfs"

      LTO_TYPE:
        description: "LTO type"
        required: false
        type: choice
        options:
          - "thin"
          - "full"
          - "none"
        default: "thin"

jobs:
  build:
    name: "${{ inputs.KERNEL_NAME }} | 5.10 | ${{ inputs.UPSTREAM_TAG || 'no-merge' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      KERNEL_NAME: ${{ inputs.KERNEL_NAME || 'Aetherium' }}
      BASE_REPO: ${{ inputs.BASE_REPO }}
      BASE_BRANCH: ${{ inputs.BASE_BRANCH || 'android12-5.10' }}
      UPSTREAM_TAG: ${{ inputs.UPSTREAM_TAG }}
      MERGE_STRATEGY: ${{ inputs.MERGE_STRATEGY || 'theirs-auto' }}
      ENABLE_KSU: ${{ inputs.ENABLE_KERNELSU_NEXT }}
      ENABLE_SUSFS: ${{ inputs.ENABLE_SUSFS }}
      KSU_BRANCH: ${{ inputs.KSU_NEXT_BRANCH || 'dev-susfs' }}
      LTO: ${{ inputs.LTO_TYPE || 'thin' }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libelf-dev libncurses5-dev libssl-dev lz4 python3 \
            python-is-python3 rsync zip unzip jq wget binutils zstd

      - name: Setup swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Configure git
        run: |
          git config --global user.email "builder@github.actions"
          git config --global user.name "Kernel Builder"
          git config --global color.ui false

      # ──────────────────────────────────────────────
      # 1. Clone base kernel (known working)
      # ──────────────────────────────────────────────
      - name: Clone base kernel
        run: |
          echo "::group::Cloning base kernel: $BASE_REPO ($BASE_BRANCH)"
          git clone --depth=1 --branch "$BASE_BRANCH" "$BASE_REPO" kernel
          echo "::endgroup::"
          cd kernel
          echo "Base HEAD: $(git log --oneline -1)"
          echo "Total commits: $(git rev-list --count HEAD)"

      # ──────────────────────────────────────────────
      # 2. Merge upstream Google tag
      # ──────────────────────────────────────────────
      - name: Merge upstream Google tag
        if: inputs.UPSTREAM_TAG != ''
        run: |
          cd kernel

          echo "::group::Adding Google upstream remote"
          git remote add google https://android.googlesource.com/kernel/common
          echo "::endgroup::"

          echo "::group::Fetching upstream tag: $UPSTREAM_TAG"
          # Unshallow so merge has history
          git fetch --unshallow origin "$BASE_BRANCH" || true
          git fetch google "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}" || {
            echo "::error::Failed to fetch tag $UPSTREAM_TAG from Google. Check if tag exists."
            exit 1
          }
          echo "::endgroup::"

          echo "── Upstream tag info ──"
          git log --oneline -1 "refs/tags/${UPSTREAM_TAG}" || true

          echo "::group::Merging upstream tag into base kernel"
          case "$MERGE_STRATEGY" in
            theirs-auto)
              echo "Strategy: Accept upstream changes on conflict (theirs)"
              git merge "refs/tags/${UPSTREAM_TAG}" \
                -X theirs \
                --no-edit \
                -m "Merge upstream ${UPSTREAM_TAG} into ${BASE_BRANCH} (auto: theirs)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (accepting upstream)"
                    git checkout --theirs "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream ${UPSTREAM_TAG} (conflicts resolved: theirs)" || true
                }
              ;;
            ours-auto)
              echo "Strategy: Keep our changes on conflict (ours)"
              git merge "refs/tags/${UPSTREAM_TAG}" \
                -X ours \
                --no-edit \
                -m "Merge upstream ${UPSTREAM_TAG} into ${BASE_BRANCH} (auto: ours)" || {
                  echo "::warning::Merge had issues, attempting to resolve remaining conflicts..."
                  git diff --name-only --diff-filter=U | while read f; do
                    echo "  Resolving: $f (keeping ours)"
                    git checkout --ours "$f" 2>/dev/null && git add "$f" || true
                  done
                  git commit --no-edit -m "Merge upstream ${UPSTREAM_TAG} (conflicts resolved: ours)" || true
                }
              ;;
            fail-on-conflict)
              echo "Strategy: Fail if any conflicts"
              git merge "refs/tags/${UPSTREAM_TAG}" \
                --no-edit \
                -m "Merge upstream ${UPSTREAM_TAG} into ${BASE_BRANCH}" || {
                  echo "::error::Merge conflicts detected! Conflicting files:"
                  git diff --name-only --diff-filter=U
                  echo ""
                  echo "::error::Use 'theirs-auto' or 'ours-auto' strategy, or resolve manually."
                  exit 1
                }
              ;;
          esac
          echo "::endgroup::"

          echo "✓ Merge complete"
          echo "Merged HEAD: $(git log --oneline -1)"

      # ──────────────────────────────────────────────
      # 3. Set kernel name
      # ──────────────────────────────────────────────
      - name: Set kernel name
        run: |
          DEFCONFIG="kernel/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
            sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" >> "$DEFCONFIG"
            echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
            echo "✓ Kernel name: -${KERNEL_NAME}"
          fi

      # ──────────────────────────────────────────────
      # 4. Patch KernelSU-Next & SuSFS
      # ──────────────────────────────────────────────
      - name: Patch KernelSU-Next
        if: inputs.ENABLE_KERNELSU_NEXT == true
        run: |
          cd kernel

          echo "::group::Integrating KernelSU-Next ($KSU_BRANCH)"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/${KSU_BRANCH}/kernel/setup.sh" | bash -s "$KSU_BRANCH"
          echo "::endgroup::"

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "" >> "$DEFCONFIG"
            echo "# KernelSU-Next" >> "$DEFCONFIG"
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_SU=n" >> "$DEFCONFIG"
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG"
            echo "✓ KSU configs added"
          fi

      - name: Patch SuSFS for 5.10
        if: inputs.ENABLE_KERNELSU_NEXT == true && inputs.ENABLE_SUSFS == true
        run: |
          cd kernel
          
          echo "::group::Integrating SuSFS for 5.10"
          git clone https://gitlab.com/simonpunk/susfs4ksu/ -b gki-android12-5.10 sus
          rm -rf sus/.git
          susfs="sus/kernel_patches"
          cp -r "$susfs/fs" .
          cp -r "$susfs/include" .
          cp -r "$susfs/50_add_susfs_in_gki-android12-5.10.patch" .
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || {
            echo "::warning::SuSFS patch had issues applying cleanly, some hunks may have failed or already been applied."
          }
          echo "::endgroup::"
          
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "✓ SuSFS configs added"
          fi

      # ──────────────────────────────────────────────
      # 5. Download toolchain & Build
      # ──────────────────────────────────────────────
      - name: Download Clang 12 toolchain (r416183b)
        run: |
          echo "::group::Downloading Clang r416183b (Clang 12)"
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$GITHUB_WORKSPACE/toolchain"
          echo "::endgroup::"
          echo "Clang version:"
          "$GITHUB_WORKSPACE/toolchain/bin/clang" --version | head -2

      - name: Build kernel
        run: |
          cd kernel
          mkdir -p "$GITHUB_WORKSPACE/dist"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="kaminarich"
          export KBUILD_BUILD_HOST="Aetherium-Builder"

          # KCFLAGS setup from XTENSEI
          export KCFLAGS="-w -march=armv8.2-a+crypto+fp16+dotprod -mtune=cortex-a55 -fno-semantic-interposition"

          echo "::group::Configuring (gki_defconfig)"
          make O=out gki_defconfig
          echo "::endgroup::"

          case "$LTO" in
            thin)
              echo "::group::Applying LTO=thin"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_THIN \
                -d LTO_NONE -d LTO_CLANG_FULL \
                -e THINLTO
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
            full)
              echo "::group::Applying LTO=full"
              scripts/config --file out/.config \
                -e LTO_CLANG -e LTO_CLANG_FULL \
                -d LTO_NONE -d LTO_CLANG_THIN
              make O=out olddefconfig
              echo "::endgroup::"
              ;;
          esac

          echo "::group::Compiling kernel"
          make O=out -j"$(nproc --all)" Image
          echo "::endgroup::"

          # Copy output
          cp out/arch/arm64/boot/Image* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true

          echo "── Build output ──"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      # ──────────────────────────────────────────────
      # 6. Package with AnyKernel3 (XTENSEI)
      # ──────────────────────────────────────────────
      - name: Package with AnyKernel3
        run: |
          echo "::group::Packaging with AnyKernel3"
          git clone --depth=1 https://github.com/XTENSEI/GrayRavens-anykernel anykernel
          
          if [ ! -f "$GITHUB_WORKSPACE/dist/Image" ]; then
            echo "::error::Image not found, cannot pack AnyKernel3"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/dist/Image" anykernel/Image
          
          KSU_TAG=""
          if [ "$ENABLE_KSU" = "true" ]; then
            KSU_TAG="-KSU-Next"
            if [ "$ENABLE_SUSFS" = "true" ]; then
              KSU_TAG="-KSU-Next-SuSFS"
            fi
          fi

          UPSTREAM_LABEL="${UPSTREAM_TAG:-base-only}"
          BUILD_NAME="${KERNEL_NAME}-5.10-${UPSTREAM_LABEL}${KSU_TAG}"
          DATE_TAG=$(date +%Y%m%d)
          ZIP_NAME="${BUILD_NAME}-${DATE_TAG}-${GITHUB_RUN_NUMBER}"

          cd anykernel
          zip -r9 "../dist/${ZIP_NAME}.zip" . --exclude="*.git*" --exclude="README.md" --exclude="*.placeholder"
          
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "date_tag=$DATE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
        id: artifacts

      # ──────────────────────────────────────────────
      # 7. Upload & Release
      # ──────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          retention-days: 30
          compression-level: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.release_tag }}
          name: "${{ steps.artifacts.outputs.build_name }}"
          body: |
            ## 🔧 ${{ inputs.KERNEL_NAME }} — Android 5.10 GKI Kernel

            | Property | Value |
            |----------|-------|
            | **Kernel** | `${{ inputs.KERNEL_NAME }}` |
            | **Base Source** | [`${{ inputs.BASE_BRANCH }}`](${{ inputs.BASE_REPO }}) |
            | **Upstream Merged** | `${{ inputs.UPSTREAM_TAG || 'none' }}` |
            | **KernelSU-Next** | ${{ inputs.ENABLE_KERNELSU_NEXT == true && format('✅ [{0}](https://github.com/pershoot/KernelSU-Next/tree/{0})', inputs.KSU_NEXT_BRANCH) || '❌ Disabled' }} |
            | **SuSFS** | ${{ inputs.ENABLE_SUSFS == true && '✅ Enabled' || '❌ Disabled' }} |
            | **LTO** | `${{ inputs.LTO_TYPE }}` |
            | **Build** | `#${{ github.run_number }}` |
            | **Date** | `${{ steps.artifacts.outputs.date_tag }}` |

            ### 📥 Flash
            1. Download `zip` below
            2. Flash via **KernelSU Manager**, TWRP, atau EXKM.
          files: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.zip
          draft: false
          prerelease: false
